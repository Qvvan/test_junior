services:
  user:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user
    restart: always
    ports:
      - "${APP_PORT:-8001}:8000"
    env_file:
      - .env
    depends_on:
      user_db:
        condition: service_healthy
    networks:
      - network


  user_db:
    image: postgres:16.2
    container_name: user_db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - network


networks:
  network:
    driver: bridge

volumes:
  postgres_data:
    driver: local